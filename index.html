<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixr - Smart Local Services</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fixr">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #f8fafc; padding-bottom: 80px; color: #1e293b; }
    
    /* Header */
    header { background: #0f172a; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: #38bdf8; }
    .auth-btn { background: #38bdf8; color: #0f172a; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .user-profile { font-size: 13px; color: #38bdf8; font-weight: bold; display: flex; align-items: center; gap: 6px; }

    /* Search Bar */
    .search-box { padding: 14px 16px 8px; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 15px; outline: none; background: white; }

    /* Categories */
    .categories { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .chip { padding: 8px 16px; background: white; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid #e2e8f0; white-space: nowrap; cursor: pointer; }
    .chip.active { background: #0f172a; color: white; border-color: #0f172a; }

    /* Cards */
    .list { padding: 8px 16px; }
    .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .name { font-size: 16px; font-weight: 700; color: #0f172a; }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700; background: #f0fdf4; color: #166534; }
    .details { font-size: 13px; color: #64748b; margin-top: 4px; }
    .rating-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; }
    .rating { background: #fef08a; color: #854d0e; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
    .price { font-size: 14px; font-weight: 800; color: #0284c7; }

    /* Buttons */
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
    .btn { padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; }
    .btn-call { background: #f1f5f9; color: #334155; }
    .btn-wa { background: #25d366; color: white; }

    /* Login Modal Popup */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; width: 100%; max-width: 360px; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .submit-btn { width: 100%; background: #0f172a; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .close-btn { width: 100%; background: none; border: none; color: #64748b; margin-top: 10px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand">Fix<span>r</span></div>
    </div>
    <div id="authContainer">
      <button class="auth-btn" onclick="openLoginModal()">Login / Sign Up</button>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="சேவை, ஊர் அல்லது நபர் பெயரைத் தேடுக...">
  </div>

  <div class="categories" id="categoryContainer">
    <div class="chip active" onclick="filterCategory('அனைத்தும்')">அனைத்தும்</div>
    <div class="chip" onclick="filterCategory('AC சர்வீஸ்')">❄️ AC சர்வீஸ்</div>
    <div class="chip" onclick="filterCategory('RO சர்வீஸ்')">💧 RO சர்வீஸ்</div>
    <div class="chip" onclick="filterCategory('இன்வெர்ட்டர் & பேட்டரி')">🔋 இன்வெர்ட்டர் & பேட்டரி</div>
    <div class="chip" onclick="filterCategory('எலக்ட்ரீஷியன்')">⚡ எலக்ட்ரீஷியன்</div>
    <div class="chip" onclick="filterCategory('பிளம்பர்')">🔧 பிளம்பர்</div>
    <div class="chip" onclick="filterCategory('வாடகை வீடுகள்')">🏠 வாடகை வீடுகள்</div>
  </div>

  <div class="list" id="servicesList"></div>

  <!-- லாகின் / சைன்-அப் பாப்-அப் திரை (Modal) -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="modal-title">Fixr-ல் இணைக 👋</div>
      <div class="modal-sub">சேவைகளை புக் செய்ய உங்கள் விவரங்களை உள்ளிடவும்</div>
      
      <div class="form-group">
        <label>முழு பெயர் (Name)</label>
        <input type="text" id="userNameInput" class="form-input" placeholder="உங்கள் பெயர்">
      </div>
      
      <div class="form-group">
        <label>மொபைல் எண் (Mobile Number)</label>
        <input type="tel" id="userPhoneInput" class="form-input" placeholder="10 இலக்க எண்">
      </div>

      <button class="submit-btn" onclick="handleLogin()">உள்நுழைக (Submit)</button>
      <button class="close-btn" onclick="closeLoginModal()">ரத்து செய்க (Cancel)</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }

    const data = [
      { name: "CoolCare AC Solutions", category: "AC சர்வீஸ்", area: "தி. நகர் (T. Nagar)", phone: "9876543210", price: "₹499 முதல்", rating: "★ 4.9", desc: "Gas filling, ஜெட் சர்வீஸ் & இன்ஸ்டாலேஷன்" },
      { name: "AquaPure RO Care", category: "RO சர்வீஸ்", area: "வேளச்சேரி (Velachery)", phone: "9876543211", price: "₹350 முதல்", rating: "★ 4.8", desc: "Filter மாற்றம் & வாட்டர் பியூரிஃபையர் பழுது" },
      { name: "PowerMax Battery & Inverter", category: "இன்வெர்ட்டர் & பேட்டரி", area: "தாம்பரம் (Tambaram)", phone: "9876543212", price: "₹399 முதல்", rating: "★ 4.7", desc: "Water top-up, பேட்டரி டெஸ்டிங் & புதிய இன்வெர்ட்டர்" },
      { name: "பாலாஜி எலக்ட்ரிக்கல்ஸ்", category: "எலக்ட்ரீஷியன்", area: "அண்ணா நகர் (Anna Nagar)", phone: "9876543213", price: "₹250 முதல்", rating: "★ 4.8", desc: "Short circuit, MCB & வீட்டு வயரிங்" },
      { name: "குமார் பிளம்பிங் சர்வீஸ்", category: "பிளம்பர்", area: "போரூர் (Porur)", phone: "9876543214", price: "₹300 முதல்", rating: "★ 4.6", desc: "Motor பழுது, பைப் லீக்கேஜ் & டேங்க் கிளீனிங்" },
      { name: "2 BHK குடும்ப வாடகை வீடு", category: "வாடகை வீடுகள்", area: "அடையாறு (Adyar)", phone: "9876543215", price: "₹16,000/மாதம்", rating: "புதியது", desc: "லிப்ட், கார் பார்க்கிங் வசதியுடன்" }
    ];

    let currentCategory = 'அனைத்தும்';
    let searchQuery = '';

    // Login State Management
    function checkUserLoggedIn() {
      const savedUser = localStorage.getItem('fixr_user');
      const authContainer = document.getElementById('authContainer');
      if (savedUser) {
        const user = JSON.parse(savedUser);
        authContainer.innerHTML = `
          <div class="user-profile">
            <span>👤 ${user.name}</span>
            <button onclick="logout()" style="background:none; border:none; color:#f87171; font-size:11px; cursor:pointer; margin-left:4px;">(Logout)</button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `<button class="auth-btn" onclick="openLoginModal()">Login / Sign Up</button>`;
      }
    }

    function openLoginModal() {
      document.getElementById('loginModal').classList.add('active');
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.remove('active');
    }

    function handleLogin() {
      const name = document.getElementById('userNameInput').value.trim();
      const phone = document.getElementById('userPhoneInput').value.trim();

      if (!name || phone.length < 10) {
        alert('தயவுசெய்து சரியான பெயர் மற்றும் 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.');
        return;
      }

      const userData = { name: name, phone: phone };
      localStorage.setItem('fixr_user', JSON.stringify(userData));
      closeLoginModal();
      checkUserLoggedIn();
      alert('வெற்றிகரமாக உள்நுழைந்துவிட்டீர்கள்!');
    }

    function logout() {
      localStorage.removeItem('fixr_user');
      checkUserLoggedIn();
    }

    function render() {
      const container = document.getElementById('servicesList');
      container.innerHTML = '';

      const filtered = data.filter(item => {
        const catMatch = currentCategory === 'அனைத்தும்' || item.category === currentCategory;
        const searchMatch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            item.area.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            item.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            item.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return catMatch && searchMatch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:40px; color:#94a3b8;">சேவைகள் எதுவும் கிடைக்கவில்லை</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <div>
              <div class="name">${item.name}</div>
              <div class="details">📍 ${item.area}</div>
            </div>
            <span class="badge">${item.category}</span>
          </div>
          <div style="font-size:12px; color:#475569; margin: 6px 0;">${item.desc}</div>
          <div class="rating-row">
            <span class="rating">${item.rating}</span>
            <span class="price">${item.price}</span>
          </div>
          <div class="actions">
            <a href="tel:${item.phone}" class="btn btn-call">📞 Call</a>
            <a href="https://wa.me/91${item.phone}?text=வணக்கம் ${item.name}, Fixr ஆப்பில் உங்கள் சேவையைப் பார்த்தேன். விவரம் தேவை." class="btn btn-wa">💬 WhatsApp</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.chip').forEach(el => {
        el.classList.toggle('active', el.innerText.includes(cat));
      });
      render();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      render();
    });

    // Initialize
    checkUserLoggedIn();
    render();
  </script>
</body>
</html>
